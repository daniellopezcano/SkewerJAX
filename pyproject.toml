[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skewerjax"
version = "0.0.1"
description = "SkewerJAX: JAX-based pipeline for Ly-α and metal-line skewers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Lopez Cano" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# No dependencies here — you install GPU/JAX/NumPy/etc. separately.
# This keeps pip from pulling conflicting wheels.

[tool.setuptools.packages.find]
include = ["skewerjax*"]
