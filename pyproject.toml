[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skewerjax"
version = "0.0.1"
description = "Optical depth, transmitted flux and summary statistics of Lyman-alpha and metal lines along skewers, in JAX."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Lopez Cano" }]
keywords = ["cosmology", "Lyman-alpha forest", "intergalactic medium", "absorption spectra", "JAX"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
# Lower bounds = the versions this package is developed and validated with (Python 3.11.14).
# numpy < 2 is required by exojax 2.2.2 (its own metadata). The CPU build of JAX comes with `jax`;
# for NVIDIA GPUs use the `gpu` extra (JAX's own extra name: jax[cuda12]).
dependencies = [
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "numpy>=1.26.4,<2",
  "scipy>=1.16.3",
  "h5py>=3.15.1",
  "matplotlib>=3.10.8",
  "diffrax>=0.7.0",
  "exojax>=2.2.2",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.6.2"]
gpu-local = ["jax[cuda12-local]>=0.6.2"]
comparison = ["fake-spectra>=2.2.4", "psutil>=7.2.1"]
notebooks = ["jupyter>=1.1.1", "ipykernel>=7.2.0", "ipympl>=0.10.0", "ipywidgets>=8.1.8", "nbformat>=5.10.4", "nbconvert>=7.17.1"]
dev = ["pytest", "nbformat>=5.10.4", "nbconvert>=7.17.1", "psutil>=7.2.1"]

[tool.setuptools.packages.find]
include = ["skewerjax*"]

[tool.setuptools.package-data]
skewerjax = ["core/*.dat", "simulations/cloudy_tables/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
