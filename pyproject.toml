[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skewerjax"
version = "0.0.1"
description = "SkewerJAX: JAX-based pipeline for Ly-α and metal-line skewers and survey-facing stats."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Lopez Cano" }]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # Keep minimal; users can pick CPU/GPU JAX as they like.
  # You can uncomment one of these lines later:
  # "jax>=0.4.28",           # Pure CPU (pip will pick CPU wheel)
  # "jax[cuda12_pip]>=0.4.28",  # Example GPU extra; requires matching CUDA toolkit
  "numpy>=1.26",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8",
  "mypy>=1.10",
]
science = [
  "matplotlib>=3.7",
  "scipy>=1.11",
  "h5py>=3.10",
  "iminuit>=2.27",
  "ipdb>=0.13",
  "ipykernel>=6.29",
]
cpu = ["jax"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]


[tool.setuptools]
packages = ["skewerjax"]
include-package-data = true

[tool.setuptools.package-data]
# ship example configs with wheels/sdists
"skewerjax" = []

[tool.ruff]
line-length = 100
target-version = "py311"
