# pre-commit hooks (pip install -e ".[dev]"; then once: pre-commit install). Run on everything: pre-commit run --all-files
exclude: ^(skewerjax/simulations/cloudy_tables/|\.project_material/|claude_agents/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check              # lint (pyproject.toml [tool.ruff]); notebooks excluded there
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout              # the notebooks are committed with their outputs cleared
        args: [--keep-id]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(ipynb|npz|dat)$|^benchmarks/      # notebooks (nbstripout), binary / data and generated files
      - id: end-of-file-fixer
        exclude: \.(ipynb|npz|dat)$|^benchmarks/      # notebooks (nbstripout), binary / data and generated files
      - id: check-added-large-files
        args: [--maxkb=1024]        # the regression references are up to ~0.6 MB; the raw benchmark files are ignored
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
